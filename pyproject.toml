[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanin-finder"
version = "1.0.0b1"
description = "Homology-based location and annotation of Humanin and SHLP1-6 mitochondrial-derived peptides in mitogenomes and nuclear genomes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Kept in step with CITATION.cff and .zenodo.json. Software authorship may legitimately differ
# from the paper's five authors; adding the other four is a decision for the release commit.
authors = [{ name = "Fabiano Bezerra Menegidio" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# No pandas: two small CSV tables do not justify numpy plus tens of megabytes (and a slow conda
# solve); cli.write_csv writes them with the standard library.
# Upper bounds are deliberate, not caution. The conservation controls project genomes with
# Bio.Align.PairwiseAligner and take the first optimal alignment; which one comes first when several
# tie is an implementation detail, so a major Biopython release could move the reference figures. pyhmmer
# carries the bundled profile semantics. Both are pinned below the next major version and raised
# only after tests/test_conservation_regression.py passes against the new release.
dependencies = [
  "biopython>=1.83,<2",
  "click>=8.1.0,<9",
  "pyhmmer>=0.12.0,<0.13",
]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/humanin-finder"
Repository = "https://github.com/LaBiOmicS/humanin-finder"
Issues = "https://github.com/LaBiOmicS/humanin-finder/issues"
Changelog = "https://github.com/LaBiOmicS/humanin-finder/releases"

[project.scripts]
humanin-finder = "humanin_finder.cli:main"
humaninfinder = "humanin_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanin_finder = ["data/*"]

# sdist contents are governed by MANIFEST.in; see the comment there.
[tool.setuptools]
include-package-data = true

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v"
