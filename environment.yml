# Conda environment to run HumaninFinder from a clone of this repository (and to develop it).
#
#   micromamba env create -f environment.yml      # or: conda env create -f environment.yml
#   micromamba activate humaninfinder
#   humanin-finder setup
#
# Bounds match pyproject.toml. pyhmmer is held below its next minor version on purpose: it carries
# the semantics of the bundled profiles. To install the released package instead of the clone, use
# Bioconda (`conda install -c conda-forge -c bioconda humanin-finder`) or PyPI.
name: humaninfinder
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python >=3.10,<3.13
  - pip
  - biopython >=1.83,<2
  - click >=8.1.0,<9
  - pyhmmer >=0.12.0,<0.13
  # development and tests
  - pytest >=8.0.0
  - ruff >=0.4.0
  - pip:
      # HumaninFinder itself, editable, from this clone. Its dependencies are already satisfied by
      # the conda packages above, so pip installs nothing else.
      - -e .
